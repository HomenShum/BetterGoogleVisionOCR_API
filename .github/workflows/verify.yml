name: Offline verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify dependency compatibility
        run: python -m pip check
      - name: Compile source and tests
        run: python -m compileall -q googleVisionBatchExtract.py googleVisionPDFtextout.py tests
      - name: Verify actual Google SDK imports and types
        run: python -c "from google.cloud import vision, storage; assert vision.Feature(type_=vision.Feature.Type.DOCUMENT_TEXT_DETECTION); assert storage.Client"
      - name: Verify help without submitting OCR
        run: |
          python googleVisionBatchExtract.py --help
          python googleVisionPDFtextout.py --help
      - name: Run isolated offline workflow scenarios
        run: python -m unittest discover -s tests -v
